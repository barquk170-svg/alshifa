<!DOCTYPE html><html dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ئال-شىپا</title><style>body{font-family:system-ui;background:#f0f9ff;padding:20px;direction:rtl}.card{max-width:400px;margin:auto;background:white;padding:20px;border-radius:12px}input,select{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px}button{width:100%;padding:12px;background:#0ea5e9;color:white;border:none;border-radius:8px}</style></head><body><div class="card"><h2>🏥 ئال-شىپا</h2><input id="name" placeholder="ئىسىم"><input id="phone" placeholder="تېلېفون"><select id="doctor"><option>چىش</option><option>كۆز</option><option>ئومۇمىي</option></select><button onclick="send()">نومۇر ئېلىش</button><p id="msg"></p></div><script>const DB="https://alshifa-ed919-default-rtdb.firebaseio.com/requests.json";async function send(){const d={name:name.value,phone:phone.value,doctor:doctor.value,time:new Date().toLocaleString(),timestamp:Date.now()};if(!d.name||!d.phone)return alert("تولدۇرۇڭ");await fetch(DB,{method:"POST",body:JSON.stringify(d)});msg.innerText="✔️ يوللاندى";}</script></body></html>
